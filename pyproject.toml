[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pam4link"
version = "0.1.0"
description = "Behavioral model of a 106.25 Gb/s PAM4 electro-optical link"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
plots = ["matplotlib"]
dev = ["matplotlib", "pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
